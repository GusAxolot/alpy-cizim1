name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --project-name alpy_cizim --org com.alpy --platforms android .
      - run: sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's|android:label="alpy_cizim"|android:label="Alpy Misali Çizim"|' android/app/src/main/AndroidManifest.xml
      - run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icon.png android/app/src/main/res/mipmap-$d/ic_launcher.png
          done
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: alpy-cizim-apk
          path: build/app/outputs/flutter-apk/app-release.apk
